<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShowOnce</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100vh;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #141416;
        font-family: Georgia, "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center;
        padding: 32px;
      }
      .wordmark {
        font-size: 28px;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
      }
      .state {
        font-family: Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #52525b;
        margin: 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1e6b3f;
        margin: 16px auto 0;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main data-testid="desktop-loading">
      <p class="wordmark">ShowOnce</p>
      <p class="state" id="loading-state">Starting local services</p>
      <div class="dot" aria-hidden="true"></div>
      <script>
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get("error")) {
            document.getElementById("loading-state").textContent =
              "Local services did not start — relaunch the app";
          }
        } catch (e) {
          /* Keep the boot copy; the window chrome already explains. */
        }
      </script>
    </main>
  </body>
</html>
